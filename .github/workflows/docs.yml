# pokeclip-mono의 서버들에서 OpenAPI 문서·DB 스키마를 뽑아 GitHub Pages로 배포한다.
#
# mono 저장소는 읽기만 한다 — checkout해서 빌드할 뿐, 아무것도 push하지 않는다.
# springdoc 의존성도 init.gradle로, media의 스키마 보장 프로그램도 CI 체크아웃에만
# 얹는다(mono에는 커밋되지 않는다).
#
# 갱신 시점:
#   - **10분마다 mono의 develop 최신 커밋을 확인**해 바뀌었을 때만 다시 뽑는다
#     (check 잡). "develop에 머지될 때마다"를 정확히 하려면 mono의 워크플로가
#     이 레포를 호출해야 하는데, mono는 팀 공용 저장소라 그 파일(.github/)을
#     내가 단독으로 고치지 않는다 — 폴링이 팀 조율 없이 할 수 있는 최선이다.
#   - Actions 탭에서 수동 실행 (Run workflow 버튼) — 이땐 변경 여부와 무관하게 돈다
#   - 이 레포의 main에 push될 때 (스크립트·화면을 고친 경우) — 이때도 무조건 돈다
name: API docs

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # mono/develop이 마지막 배포 이후 바뀌었는지만 본다. 체크아웃도 빌드도 없어
  # 10분마다 돌아도 비용이 사실상 없다. push·workflow_dispatch는 이 결과와
  # 무관하게 항상 배포한다(이 레포 자체를 고친 경우일 수 있어서).
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: mono develop 최신 커밋
        id: head
        run: |
          sha=$(git ls-remote https://github.com/3K-PokeClip/PokeClip-mono.git refs/heads/develop | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: 마지막으로 배포한 커밋과 비교
        id: diff
        run: |
          prev=$(curl -sf https://kth4778.github.io/pokeclip-api-docs/specs/mono-sha.txt || echo none)
          if [ "$prev" = "${{ steps.head.outputs.sha }}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17 # mono의 docker-compose와 같은 메이저를 쓴다
        env:
          POSTGRES_USER: pokeclip
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: pokeclip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pokeclip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # 문서 추출용 더미다. 이 잡 안에서만 살고 어떤 실 환경과도 무관하다.
      # auth는 이 아홉 개가 없으면 의도적으로 부팅을 거부한다(services/auth/CLAUDE.md
      # 2026-08-17 — POK-93 치지직 연동으로 여섯에서 아홉으로 늘었다).
      POSTGRES_USER: pokeclip
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: pokeclip
      POSTGRES_HOST: localhost # media(Go)는 기본값이 'postgres'(compose 서비스명)라 CI에선 명시해야 한다
      JWT_SECRET: ci-docs-extraction-only-not-a-real-secret!!
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SECRET_STORE_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= # '0' 32개의 base64
      INTERNAL_API_TOKEN: ci-dummy
      CHZZK_CLIENT_ID: ci-dummy
      CHZZK_CLIENT_SECRET: ci-dummy
      CHZZK_REDIRECT_URI: http://localhost:3000/chzzk/callback

    steps:
      - uses: actions/checkout@v4

      - name: mono 저장소 checkout (읽기 전용, develop)
        uses: actions/checkout@v4
        with:
          repository: 3K-PokeClip/PokeClip-mono
          ref: develop
          path: mono

      - name: mono 커밋 SHA 기록 (다음 폴링의 비교 기준)
        run: mkdir -p site/specs && git -C mono rev-parse HEAD > site/specs/mono-sha.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mono/media/go.mod

      - name: 서버 4개 bootJar 빌드 (springdoc은 init.gradle로 주입)
        working-directory: mono/services
        run: >
          ./gradlew -I "$GITHUB_WORKSPACE/init.gradle"
          :auth:bootJar :clip:bootJar :chat-collector:bootJar :chat-detector:bootJar
          -x test --no-daemon

      - name: 문서 추출
        run: bash scripts/extract.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
