// pokeclip-mono를 건드리지 않고 빌드 순간에만 springdoc을 얹는다.
// ./gradlew -I init.gradle 로 주입한다. mono에는 이 의존성이 없다 —
// 문서 추출은 이 레포의 관심사지 mono의 관심사가 아니기 때문이다.
//
// boot 플러그인이 걸린 모듈(서버 4개)에만 얹는다. common·web-support는
// 라이브러리라 걸리지 않는다.
allprojects {
    plugins.withId('org.springframework.boot') {
        dependencies {
            implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.6'
        }
    }
}
